[project]
name = "ai-chat-assistant-backend"
version = "0.1.0"
description = "Asset Intelligence Copilot — backend"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-ai[ag-ui,anthropic]>=0.0.14",
    "google-genai>=0.3",
    "duckdb>=1.1",
    "chromadb>=0.5",
    "sentence-transformers>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
